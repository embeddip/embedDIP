name: embedDIP CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

env:
  CMAKE_VERSION: '3.25.0'
  CACHE_VERSION: v1

# Limit concurrent workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # HOST BUILD & UNIT TESTS (MATRIX)
  # ============================================================================
  host-build-test:
    name: Host Build (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: macos-latest
            compiler: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Full history for proper versioning

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: |
            build
            ~/.cache/ccache
          key: ${{ runner.os }}-cmake-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt') }}-${{ env.CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ matrix.build_type }}-
            ${{ runner.os }}-cmake-

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            lcov \
            gcovr \
            ccache \
            valgrind \
            doxygen \
            graphviz

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja lcov ccache doxygen graphviz

      - name: Setup ccache
        run: |
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true
          ccache -z

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DEMBEDDIP_BOARD=HOST \
                -DEMBEDDIP_BUILD_TESTS=ON \
                -DEMBEDDIP_BUILD_EXAMPLES=ON \
                -DEMBEDDIP_ENABLE_COVERAGE=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build_type }} -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          ccache -s

      - name: Run tests
        working-directory: build
        run: |
          ctest --output-on-failure --verbose --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Run Valgrind (Memory Check)
        if: runner.os == 'Linux' && matrix.build_type == 'Debug'
        working-directory: build
        run: |
          ctest -T memcheck --output-on-failure || true
          find Testing/Temporary -name "MemoryChecker.*.log" -exec cat {} \;

      - name: Generate code coverage
        if: runner.os == 'Linux' && matrix.build_type == 'Debug'
        run: |
          lcov --capture --directory build --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/test/*' '*/examples/*' --output-file coverage.info
          lcov --list coverage.info
          gcovr --xml-pretty --exclude-unreachable-branches --print-summary \
                -o coverage.xml --root . --exclude '.*test.*' --exclude '.*examples.*'

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.build_type == 'Debug'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/Testing/
            build/test_results/

      - name: Upload compile commands
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands
          path: build/compile_commands.json

  # ============================================================================
  # EMBEDDED TARGET BUILDS (ARM & ESP32)
  # ============================================================================
  embedded-build:
    name: ${{ matrix.board.name }} Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: STM32F746G_DISCOVERY
            display_name: STM32F746G-Discovery
            arch: arm-none-eabi
            cpu: cortex-m7
            fpu: fpv5-d16
            float-abi: hard
            architecture: ARM_CORTEX_M7
          - name: ESP32_CAM
            display_name: ESP32-CAM
            arch: xtensa-esp32-elf
            cpu: esp32
            architecture: XTENSA_LX6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache toolchain
        uses: actions/cache@v3
        with:
          path: ~/toolchain
          key: ${{ matrix.board.arch }}-toolchain-${{ env.CACHE_VERSION }}

      - name: Install ARM toolchain
        if: contains(matrix.board.arch, 'arm-none-eabi')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Install ESP32 toolchain
        if: contains(matrix.board.arch, 'xtensa-esp32-elf')
        run: |
          mkdir -p ~/toolchain
          cd ~/toolchain
          if [ ! -d "xtensa-esp32-elf" ]; then
            wget -q https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz
            tar -xzf xtensa-esp32-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz
          fi
          echo "$HOME/toolchain/xtensa-esp32-elf/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          ${{ matrix.board.arch }}-gcc --version
          ${{ matrix.board.arch }}-size --version

      - name: Compile library sources
        run: |
          echo "🔨 Building embedDIP for ${{ matrix.board.display_name }} (${{ matrix.board.architecture }})..."

          # Set compiler flags
          if [[ "${{ matrix.board.arch }}" == "arm-none-eabi" ]]; then
            FLAGS="-mthumb -mcpu=${{ matrix.board.cpu }}"
            FLAGS="$FLAGS -mfloat-abi=${{ matrix.board.float-abi }} -mfpu=${{ matrix.board.fpu }}"
          else
            FLAGS="-mlongcalls"
          fi

          FLAGS="$FLAGS -Wall -Wextra -Werror -pedantic"
          FLAGS="$FLAGS -Os -ffunction-sections -fdata-sections"
          FLAGS="$FLAGS -std=c11"

          # Add architecture defines (from board config)
          FLAGS="$FLAGS -DARCH_${{ matrix.board.architecture }}=1"
          FLAGS="$FLAGS -DBOARD_${{ matrix.board.name }}=1"

          # Add include paths (new structure)
          FLAGS="$FLAGS -I. -Icore -Iimgproc -Iwrapper"
          FLAGS="$FLAGS -Iarch -Iarch/$(echo ${{ matrix.board.architecture }} | tr '[:upper:]' '[:lower:]')"
          FLAGS="$FLAGS -Iboards/$(echo ${{ matrix.board.name }} | tr '[:upper:]' '[:lower:]')"
          FLAGS="$FLAGS -Idevice -Idevice/camera -Idevice/display -Idevice/serial"
          FLAGS="$FLAGS -Iboard"  # Legacy compatibility

          # Compile sources based on board architecture
          mkdir -p build_embedded

          # Core portable layer
          for src in core/*.c imgproc/*.c; do
            if [ -f "$src" ]; then
              echo "Compiling $src..."
              obj="build_embedded/$(basename ${src%.c}.o)"
              ${{ matrix.board.arch }}-gcc $FLAGS -c "$src" -o "$obj" || exit 1
            fi
          done

          # Architecture layer (new)
          arch_dir="arch/$(echo ${{ matrix.board.architecture }} | tr '[:upper:]' '[:lower:]')"
          for src in ${arch_dir}/*.c ${arch_dir}/*.cpp; do
            if [ -f "$src" ]; then
              echo "Compiling $src..."
              obj="build_embedded/$(basename ${src%.*}.o)"
              if [[ "$src" == *.cpp ]]; then
                ${{ matrix.board.arch }}-g++ $FLAGS -c "$src" -o "$obj" || exit 1
              else
                ${{ matrix.board.arch }}-gcc $FLAGS -c "$src" -o "$obj" || exit 1
              fi
            fi
          done

          # Legacy board files (backward compatibility)
          for src in board/common.c; do
            if [ -f "$src" ]; then
              echo "Compiling $src..."
              obj="build_embedded/$(basename ${src%.c}.o)"
              ${{ matrix.board.arch }}-gcc $FLAGS -c "$src" -o "$obj" || exit 1
            fi
          done

          echo "✅ Compilation successful!"

          # Show size analysis
          echo "📊 Size analysis:"
          ${{ matrix.board.arch }}-size build_embedded/*.o | tee size_report.txt

          # Calculate total sizes
          total_text=$(${{ matrix.board.arch }}-size build_embedded/*.o | awk 'NR>1 {sum+=$1} END {print sum}')
          total_data=$(${{ matrix.board.arch }}-size build_embedded/*.o | awk 'NR>1 {sum+=$2} END {print sum}')
          total_bss=$(${{ matrix.board.arch }}-size build_embedded/*.o | awk 'NR>1 {sum+=$3} END {print sum}')

          echo "Total TEXT: $total_text bytes"
          echo "Total DATA: $total_data bytes"
          echo "Total BSS:  $total_bss bytes"

          # Save metrics with board name
          echo "board=${{ matrix.board.display_name }}" >> size_metrics.txt
          echo "architecture=${{ matrix.board.architecture }}" >> size_metrics.txt
          echo "text=$total_text" >> size_metrics.txt
          echo "data=$total_data" >> size_metrics.txt
          echo "bss=$total_bss" >> size_metrics.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: embedded-build-${{ matrix.board.name }}
          path: |
            build_embedded/*.o
            size_report.txt
            size_metrics.txt

  # ============================================================================
  # STATIC ANALYSIS (COMPREHENSIVE)
  # ============================================================================
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: [host-build-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download compile commands
        uses: actions/download-artifact@v4
        with:
          name: compile-commands
          path: .

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cppcheck \
            clang-tidy \
            clang-tools \
            iwyu \
            python3-pip

          # Install additional Python-based tools
          pip3 install \
            lizard \
            cpplint \
            flawfinder

      - name: Run cppcheck
        run: |
          cppcheck --enable=all \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --inline-suppr \
                   --std=c11 \
                   --platform=unix64 \
                   --force \
                   --xml \
                   --xml-version=2 \
                   -I core -I imgproc -I board -I device -I wrapper \
                   core/ imgproc/ board/ wrapper/ device/ 2> cppcheck-report.xml

          # Generate human-readable report
          cppcheck --enable=all \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --inline-suppr \
                   -I core -I imgproc -I board -I device -I wrapper \
                   core/ imgproc/ board/ wrapper/ device/ 2>&1 | tee cppcheck-report.txt

      - name: Run clang-tidy
        run: |
          find core imgproc board wrapper -name "*.c" -o -name "*.cpp" | \
            xargs clang-tidy -p . --checks='*,-llvmlibc-*' \
            2>&1 | tee clang-tidy-report.txt || true

      - name: Run cyclomatic complexity check
        run: |
          lizard -l cpp -w core/ imgproc/ board/ wrapper/ device/ \
            --CCN 15 --length 100 --arguments 10 \
            --warnings_only \
            -o lizard-report.txt || true

      - name: Run security analysis
        run: |
          flawfinder --minlevel=2 --html --context \
            core/ imgproc/ board/ wrapper/ device/ \
            > flawfinder-report.html || true

      - name: Check for common issues
        run: |
          echo "🔍 Checking for common issues..."

          # Check for TODO/FIXME comments
          echo "## TODO/FIXME comments:" > code-todos.txt
          grep -rn "TODO\|FIXME\|XXX\|HACK" core/ imgproc/ board/ wrapper/ device/ || true >> code-todos.txt

          # Check for magic numbers
          echo "## Potential magic numbers:" > magic-numbers.txt
          grep -rn "[^a-zA-Z_][0-9][0-9][0-9]" core/ imgproc/ --include="*.c" --include="*.h" || true >> magic-numbers.txt

          # Check for long functions
          echo "## Functions with >100 lines:" > long-functions.txt
          lizard -l cpp core/ imgproc/ board/ wrapper/ -L 100 >> long-functions.txt || true

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            cppcheck-report.*
            clang-tidy-report.txt
            lizard-report.txt
            flawfinder-report.html
            code-todos.txt
            magic-numbers.txt
            long-functions.txt

  # ============================================================================
  # CODE FORMATTING & STYLE
  # ============================================================================
  format-check:
    name: Code Format & Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          sudo ln -sf /usr/bin/clang-format-14 /usr/bin/clang-format

      - name: Check code formatting
        run: |
          echo "🎨 Checking code formatting..."

          # Find all source files
          FILES=$(find core imgproc board wrapper device -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp")

          # Check each file
          FAILED=0
          for file in $FILES; do
            if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
              echo "❌ $file needs formatting"
              FAILED=1
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "⚠️  Some files need formatting. Run: clang-format -i <files>"
            # Don't fail CI yet, just warn
            # exit 1
          else
            echo "✅ All files are properly formatted"
          fi

      - name: Check naming conventions
        run: |
          echo "🔤 Checking naming conventions..."

          # Check for camelCase in C files (should be snake_case)
          grep -rn "[a-z][A-Z]" core/ imgproc/ --include="*.c" --include="*.h" \
            | grep -v "typedef\|struct\|enum\|^[[:space:]]*\*\|^[[:space:]]*//" \
            | head -20 \
            > naming-issues.txt || true

          if [ -s naming-issues.txt ]; then
            echo "⚠️  Potential naming convention issues found:"
            cat naming-issues.txt
          fi

  # ============================================================================
  # DOCUMENTATION GENERATION
  # ============================================================================
  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        run: |
          # Create Doxyfile if it doesn't exist
          if [ ! -f Doxyfile ]; then
            doxygen -g Doxyfile
            sed -i 's/PROJECT_NAME           = "My Project"/PROJECT_NAME           = "embedDIP"/' Doxyfile
            sed -i 's/EXTRACT_ALL            = NO/EXTRACT_ALL            = YES/' Doxyfile
            sed -i 's/GENERATE_HTML          = YES/GENERATE_HTML          = YES/' Doxyfile
            sed -i 's/GENERATE_LATEX         = YES/GENERATE_LATEX         = NO/' Doxyfile
            sed -i 's/RECURSIVE              = NO/RECURSIVE              = YES/' Doxyfile
            sed -i 's/INPUT                  =/INPUT                  = core imgproc board wrapper device/' Doxyfile
          fi

          doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: html/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: cpp

      - name: Build for CodeQL
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          cmake -B build -DEMBEDDIP_BOARD=HOST
          cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten

  # ============================================================================
  # DEPENDENCY SCANNING
  # ============================================================================
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check for known vulnerabilities in dependencies
        run: |
          echo "📦 Checking submodules and dependencies..."
          git submodule status

          # List all external dependencies
          echo "## Dependencies:" > dependencies-report.txt
          git submodule foreach 'echo "$name: $(git describe --tags --always)"' >> dependencies-report.txt

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependencies-report.txt

  # ============================================================================
  # BUILD SUMMARY & METRICS
  # ============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - host-build-test
      - embedded-build
      - static-analysis
      - format-check
      - documentation
      - security-scan
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate summary report
        run: |
          cat << EOF > $GITHUB_STEP_SUMMARY
          # 🚀 embedDIP CI/CD Summary

          ## Build Status

          | Job | Status |
          |-----|--------|
          | Host Build & Tests | ${{ needs.host-build-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Embedded Builds | ${{ needs.embedded-build.result == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Static Analysis | ${{ needs.static-analysis.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |
          | Format Check | ${{ needs.format-check.result == 'success' && '✅ Passed' || '⚠️ Issues' }} |
          | Documentation | ${{ needs.documentation.result == 'success' && '✅ Generated' || '❌ Failed' }} |
          | Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '⚠️ Issues' }} |

          ## Metrics

          EOF

          # Add embedded build sizes if available
          if [ -d "artifacts/embedded-build-STM32F746G_DISCOVERY" ]; then
            echo "### STM32F746G-Discovery Build Size" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat artifacts/embedded-build-STM32F746G_DISCOVERY/size_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ -d "artifacts/embedded-build-ESP32_CAM" ]; then
            echo "### ESP32-CAM Build Size" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat artifacts/embedded-build-ESP32_CAM/size_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Full reports available in workflow artifacts" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
