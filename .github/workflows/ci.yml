name: embedDIP CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================================
  # HOST BUILD & UNIT TESTS
  # ============================================================================
  host-build-and-test:
    name: Host Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure CMake (HOST)
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Debug \
                -DEMBEDDIP_TARGET_PLATFORM=HOST \
                -DEMBEDDIP_BUILD_TESTS=ON \
                -DEMBEDDIP_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --config Debug -j$(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-host
          path: build/Testing/

  # ============================================================================
  # STM32 CROSS-COMPILE
  # ============================================================================
  stm32-cross-compile:
    name: STM32F7 Cross-Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi cmake

      - name: Check toolchain version
        run: arm-none-eabi-gcc --version

      - name: Configure CMake (STM32F7)
        run: |
          # Check if toolchain file exists
          if [ ! -f cmake/gcc-arm-none-eabi.cmake ]; then
            echo "Toolchain file not found, creating basic one..."
            mkdir -p cmake
            cat > cmake/gcc-arm-none-eabi.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR ARM)
          set(CMAKE_CROSSCOMPILING TRUE)

          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)
          set(CMAKE_ASM_COMPILER arm-none-eabi-gcc)

          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)

          set(CMAKE_C_FLAGS_INIT "-mthumb -mcpu=cortex-m7 -mfloat-abi=hard -mfpu=fpv5-d16")
          set(CMAKE_CXX_FLAGS_INIT "-mthumb -mcpu=cortex-m7 -mfloat-abi=hard -mfpu=fpv5-d16")
          EOF
          fi

          cmake -B build-stm32 \
                -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DEMBEDDIP_TARGET_PLATFORM=STM32F7 \
                -DEMBEDDIP_BUILD_TESTS=OFF \
                -DEMBEDDIP_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-stm32 --config Release -j$(nproc) || true

      - name: Check build output
        working-directory: build-stm32
        run: |
          ls -lh
          if [ -f libembedDIP.a ]; then
            echo "✅ STM32 library built successfully"
            arm-none-eabi-size libembedDIP.a
          else
            echo "⚠️  STM32 build incomplete (may need HAL drivers)"
          fi

  # ============================================================================
  # ESP32 BUILD CHECK
  # ============================================================================
  esp32-build-check:
    name: ESP32 Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip \
                                   python3-venv cmake ninja-build ccache libffi-dev \
                                   libssl-dev dfu-util libusb-1.0-0

      - name: Setup ESP-IDF
        run: |
          mkdir -p ~/esp
          cd ~/esp
          git clone --depth 1 --branch v5.1 https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh esp32

      - name: Configure CMake (ESP32)
        run: |
          source ~/esp/esp-idf/export.sh
          cmake -B build-esp32 \
                -DCMAKE_BUILD_TYPE=Release \
                -DEMBEDDIP_TARGET_PLATFORM=ESP32 \
                -DEMBEDDIP_BUILD_TESTS=OFF \
                -DEMBEDDIP_BUILD_EXAMPLES=OFF || true
          echo "⚠️  ESP32 build configuration checked (full build requires ESP-IDF project)"

  # ============================================================================
  # STATIC ANALYSIS
  # ============================================================================
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --suppress=missingIncludeSystem \
                   --inline-suppr \
                   --error-exitcode=0 \
                   -I core -I imgproc -I board -I device -I wrapper \
                   core/ imgproc/ board/ wrapper/ 2>&1 | tee cppcheck-report.txt

      - name: Upload cppcheck report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

  # ============================================================================
  # CODE FORMATTING CHECK
  # ============================================================================
  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check code formatting
        run: |
          # Create .clang-format if it doesn't exist
          if [ ! -f .clang-format ]; then
            cat > .clang-format << 'EOF'
          ---
          BasedOnStyle: Google
          IndentWidth: 4
          TabWidth: 4
          UseTab: Never
          ColumnLimit: 100
          PointerAlignment: Left
          AllowShortFunctionsOnASingleLine: Empty
          BreakBeforeBraces: Allman
          EOF
          fi

          # Check formatting (don't fail for now, just report)
          find core imgproc board wrapper -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" | \
            xargs clang-format --dry-run --Werror 2>&1 | tee format-check.txt || true
          echo "⚠️  Formatting check complete (issues are informational only)"

  # ============================================================================
  # BUILD STATUS SUMMARY
  # ============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [host-build-and-test, stm32-cross-compile, static-analysis, format-check]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## embedDIP CI/CD Summary"
          echo ""
          echo "✅ Host Build & Tests: ${{ needs.host-build-and-test.result }}"
          echo "✅ STM32 Cross-Compile: ${{ needs.stm32-cross-compile.result }}"
          echo "✅ Static Analysis: ${{ needs.static-analysis.result }}"
          echo "✅ Format Check: ${{ needs.format-check.result }}"
