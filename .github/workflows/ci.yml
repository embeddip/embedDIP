name: embedDIP CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================================
  # HOST BUILD & UNIT TESTS
  # ============================================================================
  host-build-and-test:
    name: Host Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure CMake (HOST)
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Debug \
                -DEMBEDDIP_TARGET_PLATFORM=HOST \
                -DEMBEDDIP_BUILD_TESTS=ON \
                -DEMBEDDIP_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --config Debug -j$(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-host
          path: build/Testing/

  # ============================================================================
  # STM32 SYNTAX & COMPILATION CHECK
  # ============================================================================
  stm32-syntax-check:
    name: STM32F7 Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Check toolchain version
        run: arm-none-eabi-gcc --version

      - name: Compile core sources for STM32
        run: |
          echo "🔍 Testing STM32 source compilation (syntax check)..."

          # Compile flags for STM32F7
          FLAGS="-mthumb -mcpu=cortex-m7 -mfloat-abi=hard -mfpu=fpv5-d16"
          FLAGS="$FLAGS -Wall -Wextra -std=c11"
          FLAGS="$FLAGS -DSTM32F7xx -DARM_MATH_CM7 -D__FPU_PRESENT=1 -DTARGET_BOARD_STM32F7=1"
          FLAGS="$FLAGS -I. -Icore -Iimgproc -Iboard -Idevice -Iwrapper"

          # Test compile core modules (object files only, no linking)
          echo "Compiling core/error.c..."
          arm-none-eabi-gcc $FLAGS -c core/error.c -o /tmp/error.o || exit 1

          echo "Compiling board/common.c..."
          arm-none-eabi-gcc $FLAGS -c board/common.c -o /tmp/common.o || exit 1

          echo "Compiling imgproc/color.c..."
          arm-none-eabi-gcc $FLAGS -c imgproc/color.c -o /tmp/color.o || exit 1

          echo "✅ STM32 source files compiled successfully (syntax validated)"

          # Show object file sizes
          ls -lh /tmp/*.o
          arm-none-eabi-size /tmp/*.o

  # ============================================================================
  # ESP32 SYNTAX CHECK
  # ============================================================================
  esp32-syntax-check:
    name: ESP32 Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ESP32 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget python3 python3-pip

          # Download ESP32 toolchain
          mkdir -p ~/esp
          cd ~/esp
          wget -q https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz
          tar -xzf xtensa-esp32-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz
          export PATH="$HOME/esp/xtensa-esp32-elf/bin:$PATH"

      - name: Verify toolchain
        run: |
          export PATH="$HOME/esp/xtensa-esp32-elf/bin:$PATH"
          xtensa-esp32-elf-gcc --version

      - name: Compile core sources for ESP32
        run: |
          export PATH="$HOME/esp/xtensa-esp32-elf/bin:$PATH"
          echo "🔍 Testing ESP32 source compilation (syntax check)..."

          # Compile flags for ESP32
          FLAGS="-mlongcalls -Wall -Wextra -std=c11"
          FLAGS="$FLAGS -DARDUINO_ARCH_ESP32 -DTARGET_BOARD_ESP32=1"
          FLAGS="$FLAGS -I. -Icore -Iimgproc -Iboard -Idevice -Iwrapper"

          # Test compile core modules
          echo "Compiling core/error.c for ESP32..."
          xtensa-esp32-elf-gcc $FLAGS -c core/error.c -o /tmp/error_esp32.o || exit 1

          echo "Compiling board/common.c for ESP32..."
          xtensa-esp32-elf-gcc $FLAGS -c board/common.c -o /tmp/common_esp32.o || exit 1

          echo "✅ ESP32 source files compiled successfully (syntax validated)"

          ls -lh /tmp/*_esp32.o
          xtensa-esp32-elf-size /tmp/*_esp32.o

  # ============================================================================
  # STATIC ANALYSIS
  # ============================================================================
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --suppress=missingIncludeSystem \
                   --inline-suppr \
                   --error-exitcode=0 \
                   -I core -I imgproc -I board -I device -I wrapper \
                   core/ imgproc/ board/ wrapper/ 2>&1 | tee cppcheck-report.txt

      - name: Upload cppcheck report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

  # ============================================================================
  # CODE FORMATTING CHECK
  # ============================================================================
  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check code formatting
        run: |
          # Create .clang-format if it doesn't exist
          if [ ! -f .clang-format ]; then
            cat > .clang-format << 'EOF'
          ---
          BasedOnStyle: Google
          IndentWidth: 4
          TabWidth: 4
          UseTab: Never
          ColumnLimit: 100
          PointerAlignment: Left
          AllowShortFunctionsOnASingleLine: Empty
          BreakBeforeBraces: Allman
          EOF
          fi

          # Check formatting (don't fail for now, just report)
          find core imgproc board wrapper -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" | \
            xargs clang-format --dry-run --Werror 2>&1 | tee format-check.txt || true
          echo "⚠️  Formatting check complete (issues are informational only)"

  # ============================================================================
  # BUILD STATUS SUMMARY
  # ============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [host-build-and-test, stm32-syntax-check, esp32-syntax-check, static-analysis, format-check]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## embedDIP CI/CD Summary"
          echo ""
          echo "✅ Host Build & Tests: ${{ needs.host-build-and-test.result }}"
          echo "✅ STM32 Syntax Check: ${{ needs.stm32-syntax-check.result }}"
          echo "✅ ESP32 Syntax Check: ${{ needs.esp32-syntax-check.result }}"
          echo "✅ Static Analysis: ${{ needs.static-analysis.result }}"
          echo "✅ Format Check: ${{ needs.format-check.result }}"
