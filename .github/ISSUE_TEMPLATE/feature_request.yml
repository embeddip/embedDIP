name: ✨ Feature Request
description: Suggest a new feature or enhancement for embedDIP
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees:
  - odurgut

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is your feature request related to a problem?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: I would like to see...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which area does this feature belong to?
      options:
        - Image Processing Algorithm
        - Device Driver
        - C++ Wrapper API
        - Performance Optimization
        - Memory Management
        - Documentation
        - Build System
        - Testing
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (blocking my work)
        - High (important but workaround exists)
        - Medium (nice to have)
        - Low (minor improvement)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I considered...

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: Describe your specific use case for this feature
      placeholder: |
        I'm building a computer vision application that needs to...
        This feature would allow me to...

  - type: textarea
    id: api_example
    attributes:
      label: Proposed API (Optional)
      description: If you have an idea for the API, show an example of how it would be used
      render: c
      placeholder: |
        // Example usage
        Image* img = createImage(IMAGE_RES_VGA, IMAGE_FORMAT_RGB888);
        newFeature(img, parameters);
        deleteImage(img);

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas (Optional)
      description: Do you have any ideas about how this could be implemented?

  - type: dropdown
    id: platforms
    attributes:
      label: Target Platforms
      description: Which platforms should support this feature?
      multiple: true
      options:
        - All platforms
        - STM32 only
        - ESP32 only
        - Host (PC) only
        - Platform-specific

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking Change
      description: Would this be a breaking change to the existing API?
      options:
        - No, fully backward compatible
        - Yes, requires API changes
        - Not sure
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or references about the feature request

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to contribute a PR for this feature
          required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for similar feature requests
          required: true
        - label: I have provided a clear use case for this feature
          required: true
