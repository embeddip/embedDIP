name: 🐛 Bug Report
description: Report a bug or unexpected behavior in embedDIP
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - odurgut

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the information below to help us diagnose and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Initialize image with '...'
        2. Apply filter '...'
        3. Call function '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, what happened was...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Target Platform
      description: Which platform are you using?
      options:
        - STM32F7
        - STM32F4
        - STM32H7
        - ESP32
        - ESP32-S3
        - Host (x86/x64)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: embedDIP Version
      description: Which version of embedDIP are you using?
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: build_type
    attributes:
      label: Build Configuration
      options:
        - Debug
        - Release
        - MinSizeRel
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Development Environment
      description: Provide details about your development environment
      placeholder: |
        - OS: Ubuntu 22.04
        - Compiler: GCC 11.3.0
        - CMake: 3.25.0
        - IDE: VSCode / STM32CubeIDE
    validations:
      required: true

  - type: textarea
    id: code_sample
    attributes:
      label: Minimal Code Example
      description: Provide a minimal code example that reproduces the issue
      render: c
      placeholder: |
        #include <embedDIP.h>

        int main() {
            Image* img = createImage(IMAGE_RES_VGA, IMAGE_FORMAT_GRAYSCALE);
            // Code that reproduces the bug
            deleteImage(img);
            return 0;
        }

  - type: textarea
    id: error_output
    attributes:
      label: Error Output
      description: Copy and paste any relevant error messages or logs
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, memory dumps, etc.)

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched for similar issues in the issue tracker
          required: true
        - label: I have provided all the requested information
          required: true
        - label: I am using the latest version of embedDIP (or have verified the bug exists in the latest version)
          required: false
